services:
  # Main Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teams-rag-app
    ports:
      - "3000:80"           # Map container port 80 to host port 3000
      - "8000:8000"         # Expose backend API (optional)
    stdin_open: true        # Keep stdin open for interactive CLI
    tty: true               # Allocate a pseudo-TTY for terminal interaction
    environment:
      # Database service hostnames (using Docker service names)
      - VECTOR_DB_HOST=milvus-standalone
      - VECTOR_DB_PORT=19530
      - GRAPH_DB_URI=bolt://neo4j:7687
      - GRAPH_DB_USER=neo4j
      - GRAPH_DB_PASSWORD=${NEO4J_PASSWORD:-changeme}
      # LLM service - defaults to external ollama on host
      # Use http://ollama:11434 if running with --profile with-ollama
      - LLM_HOST_URL=${LLM_HOST_URL:-http://host.docker.internal:11434}
      # Teams authentication (from host .env if exists)
      - TENANT_ID=${TENANT_ID:-}
      - CLIENT_ID=${CLIENT_ID:-}
      - CLIENT_SECRET=${CLIENT_SECRET:-}
      - AUTH_MODE=${AUTH_MODE:-delegated}
    volumes:
      # Mount SQLite cache as bind mount for easy access
      - ./.cache:/app/.cache
      # Mount output directory
      - ./output:/app/output
    depends_on:
      - milvus-standalone
      - neo4j
      # ollama is optional (removed from depends_on)
    extra_hosts:
      # Allow app to reach host machine (for external ollama)
      - "host.docker.internal:host-gateway"
    networks:
      - teams-rag-network
    restart: unless-stopped

  # Milvus ETCD
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - teams-rag-network
    restart: unless-stopped

  # Milvus MinIO
  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - teams-rag-network
    restart: unless-stopped

  # Milvus Standalone
  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      ETCD_USE_EMBED: false
      COMMON_STORAGETYPE: remote
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 180s
      timeout: 20s
      retries: 10
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - teams-rag-network
    restart: unless-stopped

  # Neo4j graph database
  neo4j:
    image: neo4j:5.15-community
    container_name: teams-rag-neo4j
    # Ports not exposed by default (app uses internal Docker network via bolt://neo4j:7687)
    # Uncomment if you need external access to Neo4j Browser or Bolt:
    # ports:
    #   - "7474:7474"  # HTTP (Neo4j Browser)
    #   - "7687:7687"  # Bolt (Database connection)
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Updated to Neo4j 5.x settings (removed deprecation warnings)
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
    networks:
      - teams-rag-network
    restart: unless-stopped

  # Ollama LLM service (commented out - uncomment if you need bundled ollama)
  # To use bundled ollama:
  # 1. Uncomment this entire service
  # 2. Set LLM_HOST_URL=http://ollama:11434 in .env
  # 3. Run: docker compose up --build

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: teams-rag-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - teams-rag-network
  #   restart: unless-stopped

# Named volumes for persistent data
volumes:
  etcd:
    name: teams-rag-etcd
  minio_data:
    name: teams-rag-minio-data
  milvus_data:
    name: teams-rag-milvus-data
  neo4j-data:
    name: teams-rag-neo4j-data
  neo4j-logs:
    name: teams-rag-neo4j-logs
  neo4j-import:
    name: teams-rag-neo4j-import
  neo4j-plugins:
    name: teams-rag-neo4j-plugins
  # Ollama volume (only needed if you uncomment the ollama service)
  # ollama-data:
  #   name: teams-rag-ollama-data

# Custom network for service communication
networks:
  teams-rag-network:
    name: teams-rag-network
    driver: bridge
